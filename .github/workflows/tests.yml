name: Build PreTeXt Book

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build PreTeXt HTML
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PreTeXt CLI
        run: |
          pip install --upgrade pip
          pip install pretextbook

      - name: Build PreTeXt HTML
        run: |
          cd pretext
          pretext build web
